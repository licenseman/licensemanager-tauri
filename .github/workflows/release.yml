name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # npm provenance + crates.io trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux Tauri dependencies
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libdbus-1-dev pkg-config
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-io-auth
      # Opens the "Version Packages" PR, or publishes once it is merged:
      # the crate first (skipped if already out), then npm, tag and release.
      - uses: changesets/action@v2
        with:
          version: pnpm run version
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
