# cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# RustSec advisories fail the build; unmaintained crates only in our own deps.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Both come from jsonwebtoken's `rust_crypto` backend, which always pulls
    # its RSA and ECDSA verifiers. The plugin only verifies EdDSA (the
    # algorithm is pinned), so those code paths never run. Revisit when
    # jsonwebtoken lets apps select algorithms by feature.
    { id = "RUSTSEC-2023-0071", reason = "rsa: unused, only EdDSA tokens are verified" },
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint via p256/p384: unused, only EdDSA tokens are verified" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
]
confidence-threshold = 0.9

[[licenses.clarify]]
crate = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
# The example app is not published.
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
